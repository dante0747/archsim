# A voting app in the style of common docker-compose examples (written for ArchSim's tests).
name: voting
services:
  proxy:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    depends_on: [vote, result]
  vote:
    build: ./vote
    image: example/vote:1.4
    environment:
      REDIS_URL: redis://redis:6379/0
    deploy:
      replicas: 3
      resources:
        limits: {cpus: "0.5", memory: 256M}
  worker:
    image: example/worker:1.4
    environment:
      - QUEUE_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:secret@db:5432/votes
    depends_on: [redis, db]
  result:
    image: example/result:1.4
    environment:
      DATABASE_URL: postgresql://postgres:secret@db:5432/votes
    deploy:
      replicas: 2
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"]}
  db:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=80"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    deploy:
      resources:
        limits: {cpus: "2", memory: 4G}
volumes:
  db-data: {}
networks:
  back: {}
