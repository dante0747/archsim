[project]
name = "archsim-engine"
version = "0.2.0"
description = "ArchSim discrete-event simulation engine and architecture domain model (independent of any web framework)."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "simpy>=4.1",
  "pydantic>=2.9",
  "pyyaml>=6.0",  # imports, calibration mappings (archsim_engine.safe_yaml)
]

[project.scripts]
archsim = "archsim_engine.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archsim_engine"]
