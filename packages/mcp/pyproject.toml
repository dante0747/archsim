[project]
name = "archsim-mcp"
version = "0.1.0"
description = "MCP server for ArchSim: design, simulate and explain architectures from AI coding agents (stdio)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "archsim-engine",
  "mcp>=2.3,<3",  # the v2 API (MCPServer)
]

[project.scripts]
archsim-mcp = "archsim_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archsim_mcp"]
