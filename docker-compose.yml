# Local development stack. Ports are bound to 127.0.0.1 only: it runs without sign-in
# (ARCHSIM_AUTH_MODE=none; see SECURITY.md before letting anyone else in).
#
#   ./gradlew :archsim-app:jibDockerBuild    # the Java API's image (make image); again after
#                                            # changing the Java code
#   docker compose up -d postgres            # just the database (run the API and web locally)
#   docker compose up --build                # everything: http://localhost:3000
#   docker compose up --build --scale worker=3   # more simulation workers
#
# The API is the Java one (archsim-app). It calls the Python engine service for the engine's
# synchronous calls, and Python workers simulate the runs it queues (docs/proposals/java-25-port.md).
name: archsim

# archsim-app's image, which Jib builds into the local Docker (ADR-0014); compose does not
# build it. Started as migrate or api.
x-archsim-app: &archsim-app
  image: archsim-app:local
  pull_policy: never

x-worker-build: &worker-build
  context: .
  dockerfile: services/api/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archsim
      POSTGRES_PASSWORD: archsim # local development default; change for any shared use
      POSTGRES_DB: archsim
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archsim -d archsim"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: brings the database to the latest schema (Flyway), then exits. The API waits for it.
  migrate:
    <<: *archsim-app
    command: ["migrate"]
    environment:
      ARCHSIM_DATABASE_URL: postgresql+psycopg://archsim:archsim@postgres:5432/archsim
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The simulation a calibration replays, until stage 4 ports the simulator (ADR-0036,
  # ADR-0045), for the API only. It checks no caller, so only the API shares its network.
  engine:
    build:
      context: .
      dockerfile: services/engine-service/Dockerfile
    networks: [engine]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    <<: *archsim-app
    command: ["api"]
    # Settings for this machine, such as sign-in and its secrets: put them in .env.docker (git
    # ignores it; see the sign-in block of .env.example). Without the file, no sign-in.
    env_file:
      - path: .env.docker
        required: false
    environment:
      ARCHSIM_DATABASE_URL: postgresql+psycopg://archsim:archsim@postgres:5432/archsim
      ARCHSIM_AUTO_MIGRATE: "false" # the migrate service did it
      ARCHSIM_CORS_ORIGINS: '["http://localhost:3000"]'
      ARCHSIM_ENGINE_URL: http://engine:8001
    depends_on:
      migrate:
        condition: service_completed_successfully
      engine:
        condition: service_healthy
    networks: [default, engine]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # the image has bash but no HTTP client
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v1/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Simulation workers: they take the runs the API queues in PostgreSQL and, on SIGTERM, give
  # the runs in flight back to the queue. Scale with --scale worker=N.
  worker:
    build: *worker-build
    init: true # reaps and signals the simulation processes
    command: ["archsim-api", "worker"]
    # The API's settings: the worker reads ARCHSIM_AUTH_MODE and ARCHSIM_RATE_LIMITS from them,
    # and with limits on caps the runs each workspace kind simulates at once.
    env_file:
      - path: .env.docker
        required: false
    environment:
      ARCHSIM_DATABASE_URL: postgresql+psycopg://archsim:archsim@postgres:5432/archsim
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      ARCHSIM_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

networks:
  engine: {}

volumes:
  pgdata:
