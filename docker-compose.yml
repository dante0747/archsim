# ArchSim's whole stack, from its release images: PostgreSQL, the migration, the API, a
# simulation worker and the web app. Docker alone runs it, nothing to build:
#
#   docker compose up                            # everything: http://localhost:3000
#   docker compose up --scale worker=3           # more simulation workers
#   docker compose up -d postgres                # just the database (run the API and web locally)
#
# The images are the ones a release publishes, at the version this checkout names (version in
# gradle.properties; ADR-0076, ADR-0077). They don't hold changes made since; to run images built
# from this checkout, add docker-compose.local.yml (make up-local):
#
#   ./gradlew :archsim-app:jibDockerBuild        # make image: archsim-app:local, again after a change
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# Ports are bound to 127.0.0.1 only: it runs without sign-in (ARCHSIM_AUTH_MODE=none; see
# SECURITY.md before letting anyone else in). The API and the workers are Java (archsim-app): the
# workers simulate the runs the API queues (ADR-0053), and the API replays calibrations itself.
name: archsim

# archsim-app's image (ADR-0014), started as migrate, api or worker
x-archsim-app: &archsim-app
  image: ghcr.io/dante0747/archsim-app:1.3.0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archsim
      POSTGRES_PASSWORD: archsim # local development default; change for any shared use
      POSTGRES_DB: archsim
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archsim -d archsim"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: brings the database to the latest schema (Flyway), then exits. The API waits for it.
  migrate:
    <<: *archsim-app
    command: ["migrate"]
    environment:
      ARCHSIM_DATABASE_URL: postgresql://archsim:archsim@postgres:5432/archsim
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *archsim-app
    command: ["api"]
    # the image exits when its heap runs out; start it again
    restart: on-failure
    # Settings for this machine, such as sign-in and its secrets: put them in .env.docker (git
    # ignores it; see the sign-in block of .env.example). Without the file, no sign-in.
    env_file:
      - path: .env.docker
        required: false
    environment:
      ARCHSIM_DATABASE_URL: postgresql://archsim:archsim@postgres:5432/archsim
      ARCHSIM_AUTO_MIGRATE: "false" # the migrate service did it
      ARCHSIM_CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # the image has bash but no HTTP client
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v1/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Simulation workers: they take the runs the API queues in PostgreSQL, each on a thread of its
  # own, and on SIGTERM give the runs in flight back to the queue. Scale with --scale worker=N.
  # The runs share a worker's heap, sized for its runs at once (archsim-app/README.md). A worker
  # whose heap runs out exits (the image's -XX:+ExitOnOutOfMemoryError) and is started again,
  # and once its lease ends the reaper requeues its runs (ADR-0053).
  worker:
    <<: *archsim-app
    command: ["worker"]
    restart: on-failure
    # The API's settings: the worker reads ARCHSIM_AUTH_MODE and ARCHSIM_RATE_LIMITS from them,
    # and with limits on caps the runs each workspace kind simulates at once.
    env_file:
      - path: .env.docker
        required: false
    environment:
      ARCHSIM_DATABASE_URL: postgresql://archsim:archsim@postgres:5432/archsim
      ARCHSIM_MAX_CONCURRENT_RUNS: "3"
      JAVA_TOOL_OPTIONS: -Xmx2g
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

  web:
    image: ghcr.io/dante0747/archsim-web:1.3.0
    environment:
      ARCHSIM_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
