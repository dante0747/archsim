# Local development stack. Ports are bound to 127.0.0.1 only: it runs without sign-in
# (ARCHSIM_AUTH_MODE=none; see SECURITY.md before letting anyone else in).
#
#   docker compose up -d postgres     # just the database (run API and web locally)
#   docker compose up --build         # everything: http://localhost:3000
#   docker compose --profile workers up --build --scale worker=2   # plus two extra workers
name: archsim

x-api-image: &api-image
  context: .
  dockerfile: services/api/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archsim
      POSTGRES_PASSWORD: archsim # local development default; change for any shared use
      POSTGRES_DB: archsim
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archsim -d archsim"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: brings the database to the latest schema, then exits. The API waits for it.
  migrate:
    build: *api-image
    command: ["archsim-api", "migrate"]
    environment:
      ARCHSIM_DATABASE_URL: postgresql+psycopg://archsim:archsim@postgres:5432/archsim
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-image
    init: true # reaps and signals the simulation processes
    environment:
      ARCHSIM_DATABASE_URL: postgresql+psycopg://archsim:archsim@postgres:5432/archsim
      ARCHSIM_AUTO_MIGRATE: "false" # the migrate service did it
      ARCHSIM_EXAMPLES_DIR: /app/examples
      ARCHSIM_CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s # time to give runs in flight back to the queue
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # More simulation workers, on top of the one inside the API. They share the queue in
  # PostgreSQL; on SIGTERM each gives its runs back to it.
  worker:
    build: *api-image
    init: true
    profiles: ["workers"]
    command: ["archsim-api", "worker"]
    environment:
      ARCHSIM_DATABASE_URL: postgresql+psycopg://archsim:archsim@postgres:5432/archsim
      ARCHSIM_AUTO_MIGRATE: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      ARCHSIM_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
