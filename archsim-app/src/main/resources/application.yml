# archsim-app's own settings. ArchSim's settings are ARCHSIM_* environment variables, as for the
# Python API (io.archsim.app.config.ArchsimProperties); these are Spring Boot's.
spring:
  application:
    name: archsim
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  security:
    filter:
      # Spring Security's chain right after the character encoding and before the body-size
      # limit (BodySizeFilter), so every answer carries the security headers
      order: -2147483647
  autoconfigure:
    # people sign in with GitHub or Google, never as a user of Spring Security's own
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    hikari:
      # fail a health check within 10 s rather than 30, as the Python API's connect timeout
      connection-timeout: 10000
      # start without the database; /health says when it is unreachable
      initialization-fail-timeout: -1

server:
  port: 8000
  # this machine only, as the Python API did: without sign-in, whoever reaches the API owns
  # everything in it (SECURITY.md). Set SERVER_ADDRESS or --server.address to open it up.
  address: 127.0.0.1

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/v1/docs

---
# the worker role serves no HTTP and runs its work on daemon threads: keep the JVM running
# until the role is stopped (ADR-0053)
spring:
  config:
    activate:
      on-profile: worker
  main:
    keep-alive: true
