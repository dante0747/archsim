[project]
name = "archsim-workspace"
version = "0.1.0"
description = "Development workspace for ArchSim (engine + API). Not published."
requires-python = ">=3.11"
dependencies = ["archsim-engine", "archsim-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/engine", "services/api"]

[tool.uv.sources]
archsim-engine = { workspace = true }
archsim-api = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["archsim_engine", "archsim_api", "engine_builders", "api_helpers"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]
"services/api/alembic/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["packages/engine/tests", "services/api/tests"]
addopts = "-q"
filterwarnings = [
  # Starlette suggests a different HTTP client for its TestClient; httpx still works.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
