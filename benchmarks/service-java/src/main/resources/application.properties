server.port=8080
spring.main.banner-mode=off
logging.level.root=WARN
# Tomcat's thread pool as Spring Boot ships it (200 threads): ArchSim models it as 200 workers.
server.tomcat.threads.max=200
# Keep-alive like the Node.js service (65 s, no request limit), so k6 reuses its connections as it
# does on every other stack; Tomcat's default closes a connection after 100 requests.
server.tomcat.max-keep-alive-requests=-1
server.tomcat.keep-alive-timeout=65s
