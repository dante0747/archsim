# Reproducible stacks for ArchSim's accuracy benchmarks (docs/validation.md). Run them with
# `./gradlew :archsim-benchmarks:run --args="<stack>"`; the harness starts the profile it needs.
#
# Each container is pinned to its own CPUs (cpuset, not a CPU quota: quotas throttle in 100 ms
# periods and add latency spikes the model does not have). The ArchSim model of each stack uses
# the same CPU counts. The defaults assume Docker with at least 8 CPUs; on a smaller machine set
# BENCH_CPUS_POSTGRES, _REDIS, _REDIS_TTL, _KAFKA, _SERVICE, _CONSUMER, _GATEWAY, _CHAIN_API,
# _JAVA, _GO, _PYTHON, _PYTHON_CORES, _PYTHON_WIDE, _GO_POOL and _K6 (results are then noisier).
#
# Held-out stacks (docs/validation.md, "Held-out experiments"; sealed: only the harness's `smoke` runs
# them until a frozen engine has predicted them): java-mixed, go-mixed and python-mixed run
# pg-mixed's workload on Spring Boot, Go and Flask/gunicorn, each on CPUs 2,3 (one physical core
# of the laptop: hyperthread siblings); chain puts a Node.js gateway in front of the Node.js API;
# cache-ttl is a Node.js cache-aside service with a 5 s TTL over 1,000,000 keys. On the laptop
# (siblings 0-1, 2-3, 4-5, 6-7) no container of these stacks shares a physical core with k6 or
# another container: chain and cache-ttl leave CPUs 1 and 3 idle and give k6 one core (6,7).
#
# The second held-out set (ADR-0090, docs/adr/0090; registered on 19 Nov 2026, sealed and not yet
# measured) adds three stacks. python-cores and python-wide run python-mixed's service and workload
# on CPUs 0,2 and on CPUs 0-3; go-pool runs go-mixed's service on go-mixed's CPUs with a pool of 2
# PostgreSQL connections where every other service has 10. The set's other two experiments run on
# stacks above: java-hot-row on java-mixed's and cache-miss on cache-ttl's. Docker's VM numbers its
# CPUs as hyperthread pairs (0-1, 2-3, 4-5, 6-7), so it numbers 0 and 2 as two cores and 0-3 as
# both CPUs of each; Windows schedules the VM's CPUs itself, so the numbering may not say who
# shares a physical core (the contention check of 1 Nov 2026, docs/validation.md, "Environment").
# As numbered, no container of these three stacks shares a core with k6 or another container; the
# two Python stacks leave k6 CPUs 6,7.
name: archsim-bench

x-service: &service
  build: ./service
  image: archsim-bench-service:1
  restart: on-failure
  environment: &service-env
    DATABASE_URL: postgresql://bench:bench@postgres:5432/bench
    PG_POOL: "10"
  depends_on:
    postgres:
      condition: service_healthy

# Another runtime behind the same HTTP contract as ./service (each sets its own build and image).
x-runtime: &runtime
  restart: on-failure
  environment: &runtime-env
    DATABASE_URL: postgresql://bench:bench@postgres:5432/bench
    PG_POOL: "10"
  depends_on:
    postgres:
      condition: service_healthy
  ports:
    - "127.0.0.1:18080:8080"

services:
  postgres:
    image: postgres:16-alpine
    profiles: [postgres, cache, kafka, java-mixed, go-mixed, python-mixed, chain, cache-ttl,
               python-cores, python-wide, go-pool]
    cpuset: "${BENCH_CPUS_POSTGRES:-4,5}"
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
      # rows in items: init.sql loads 100,000 and extra-rows.sh the rest (the harness sets it per
      # stack: 1,000,000 for cache-ttl's keyspace)
      BENCH_ITEMS: "${BENCH_ITEMS:-100000}"
    # Checkpoints are deferred past a run (the model has no checkpoints; see docs/validation.md);
    # checkpoints and autovacuum are logged so stalls can be traced. pg_stat_statements and the
    # WAL's I/O timing let calibration read the time each statement spends inside PostgreSQL and
    # the time of each WAL flush under load (the harness's PostgresProbe).
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
      - -c
      - checkpoint_timeout=1d
      - -c
      - max_wal_size=8GB
      - -c
      - log_checkpoints=on
      - -c
      - log_autovacuum_min_duration=0
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_wal_io_timing=on
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/extra-rows.sh:/docker-entrypoint-initdb.d/zz-extra-rows.sh:ro
    # Over TCP: while the init scripts run, the image's temporary server answers on its socket
    # only, so a socket check would pass before the data is loaded.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bench -d bench"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    profiles: [cache]
    cpuset: "${BENCH_CPUS_REDIS:-1}"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  redis-ttl:
    image: redis:7-alpine
    profiles: [cache-ttl]
    cpuset: "${BENCH_CPUS_REDIS_TTL:-0}"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  kafka:
    image: apache/kafka:3.8.0
    profiles: [kafka]
    cpuset: "${BENCH_CPUS_KAFKA:-0,1}"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    # The check starts a JVM, so it runs only until it first succeeds; then a marker file answers.
    # Until run 7 it ran every 3 s for the stack's whole life: about 0.5 cores of JVM start-ups on
    # the broker's one physical core, which grew the publish tail with load (client p95 41 ms at
    # 1,890 req/s against 5 ms without it; W23 trial, results/trials/2026-10-31-kafka-w23/).
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready || (/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 && touch /tmp/ready)"]
      interval: 3s
      timeout: 10s
      retries: 40

  api:
    <<: *service
    profiles: [postgres, cache]
    cpuset: "${BENCH_CPUS_SERVICE:-2}"
    environment:
      <<: *service-env
      REDIS_URL: ${BENCH_REDIS_URL:-}
      CACHE_TTL_S: "30"
    ports:
      - "127.0.0.1:18080:8080"

  producer:
    <<: *service
    profiles: [kafka]
    cpuset: "${BENCH_CPUS_SERVICE:-2}"
    environment:
      <<: *service-env
      KAFKA_BROKERS: kafka:9092
      KAFKA_PARTITIONS: "6"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"

  consumer:
    <<: *service
    profiles: [kafka]
    cpuset: "${BENCH_CPUS_CONSUMER:-3}"
    environment:
      <<: *service-env
      ROLE: consumer
      KAFKA_BROKERS: kafka:9092
      KAFKA_PARTITIONS: "6"
      KAFKA_CONSUMERS: "3"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:8080"

  # ---- held-out stacks (sealed) -----------------------------------------------------------------

  api-java:
    <<: *runtime
    build: ./service-java
    image: archsim-bench-java:1
    profiles: [java-mixed]
    cpuset: "${BENCH_CPUS_JAVA:-2,3}"

  api-go:
    <<: *runtime
    build: ./service-go
    image: archsim-bench-go:1
    profiles: [go-mixed]
    cpuset: "${BENCH_CPUS_GO:-2,3}"
    environment:
      <<: *runtime-env
      GOMAXPROCS: "2"

  api-python:
    <<: *runtime
    build: ./service-python
    image: archsim-bench-python:1
    profiles: [python-mixed]
    cpuset: "${BENCH_CPUS_PYTHON:-2,3}"
    environment:
      <<: *runtime-env
      WEB_WORKERS: "10"

  gateway:
    <<: *service
    profiles: [chain]
    cpuset: "${BENCH_CPUS_GATEWAY:-0}"
    environment:
      <<: *service-env
      ROLE: gateway
      UPSTREAM: http://chain-api:8080
    depends_on:
      chain-api:
        condition: service_started
    ports:
      - "127.0.0.1:18080:8080"

  chain-api:
    <<: *service
    profiles: [chain]
    cpuset: "${BENCH_CPUS_CHAIN_API:-2}"
    ports:
      - "127.0.0.1:18081:8080"

  api-ttl:
    <<: *service
    profiles: [cache-ttl]
    cpuset: "${BENCH_CPUS_SERVICE:-2}"
    environment:
      <<: *service-env
      REDIS_URL: redis://redis-ttl:6379
      CACHE_TTL_S: "5"
      REDIS_STATS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis-ttl:
        condition: service_started
    ports:
      - "127.0.0.1:18080:8080"

  # ---- the second held-out set's stacks (sealed, ADR-0090) --------------------------------------

  # python-mixed's service on CPUs 0 and 2, which the VM numbers as two cores; 1 and 3 stay idle.
  api-python-cores:
    <<: *runtime
    build: ./service-python
    image: archsim-bench-python:1
    profiles: [python-cores]
    cpuset: "${BENCH_CPUS_PYTHON_CORES:-0,2}"
    environment:
      <<: *runtime-env
      WEB_WORKERS: "10"

  # python-mixed's service on four CPUs, still with gunicorn's 10 workers.
  api-python-wide:
    <<: *runtime
    build: ./service-python
    image: archsim-bench-python:1
    profiles: [python-wide]
    cpuset: "${BENCH_CPUS_PYTHON_WIDE:-0-3}"
    environment:
      <<: *runtime-env
      WEB_WORKERS: "10"

  # go-mixed's service on go-mixed's CPUs, with a pool of 2 PostgreSQL connections instead of 10.
  api-go-pool:
    <<: *runtime
    build: ./service-go
    image: archsim-bench-go:1
    profiles: [go-pool]
    cpuset: "${BENCH_CPUS_GO_POOL:-2,3}"
    environment:
      <<: *runtime-env
      GOMAXPROCS: "2"
      PG_POOL: "2"

  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    # The harness sets BENCH_CPUS_K6 per stack (the CPUs the stack leaves free, except the service's
    # hyperthread sibling, which stays idle) and records each container's cpuset and how they
    # fall on physical cores in results/<experiment>/environment.json.
    cpuset: "${BENCH_CPUS_K6:-6,7}"
    # k6's garbage collector marks every virtual user's memory in each cycle, and with a thousand
    # of them its cycles came often enough to add a tail of their own: at 3,000 req/s on the
    # idle laptop pg-mixed's p95 read 6 to 11 ms with 200 virtual users, 59 ms with 1,000 and
    # 140 to 240 ms with 3,050, the median unchanged. Letting the heap grow eight times between
    # cycles (GOGC), under a limit that keeps k6 inside Docker's VM (GOMEMLIMIT), brought 650 to
    # 3,050 virtual users back to 3 to 10 ms (docs/adr/0086).
    environment:
      GOGC: "800"
      GOMEMLIMIT: 3GiB
    # The image runs as uid 12345: the harness makes results/.k6 writable for it (chmod 777) so that
    # handleSummary can write on Linux (untested on Linux so far).
    volumes:
      - ./k6:/scripts:ro
      - ./results/.k6:/out
