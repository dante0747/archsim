# Reproducible stacks for ArchSim's accuracy benchmarks (docs/validation.md). Run them with
# `uv run python benchmarks/run.py <stack>`; the runner starts the profile it needs.
#
# Each container is pinned to its own CPUs (cpuset, not a CPU quota: quotas throttle in 100 ms
# periods and add latency spikes the model does not have). The ArchSim model of each stack uses
# the same CPU counts. The defaults assume Docker with at least 8 CPUs; on a smaller machine set
# BENCH_CPUS_POSTGRES, _REDIS, _KAFKA, _SERVICE, _CONSUMER and _K6 (results are then noisier).
name: archsim-bench

x-service: &service
  build: ./service
  image: archsim-bench-service:1
  restart: on-failure
  environment: &service-env
    DATABASE_URL: postgresql://bench:bench@postgres:5432/bench
    PG_POOL: "10"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    profiles: [postgres, cache, kafka]
    cpuset: "${BENCH_CPUS_POSTGRES:-4,5}"
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    # Checkpoints are deferred past a run (the model has no checkpoints; see docs/validation.md);
    # checkpoints and autovacuum are logged so stalls can be traced.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
      - -c
      - checkpoint_timeout=1d
      - -c
      - max_wal_size=8GB
      - -c
      - log_checkpoints=on
      - -c
      - log_autovacuum_min_duration=0
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    profiles: [cache]
    cpuset: "${BENCH_CPUS_REDIS:-1}"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  kafka:
    image: apache/kafka:3.8.0
    profiles: [kafka]
    cpuset: "${BENCH_CPUS_KAFKA:-0,1}"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40

  api:
    <<: *service
    profiles: [postgres, cache]
    cpuset: "${BENCH_CPUS_SERVICE:-2}"
    environment:
      <<: *service-env
      REDIS_URL: ${BENCH_REDIS_URL:-}
      CACHE_TTL_S: "30"
    ports:
      - "127.0.0.1:18080:8080"

  producer:
    <<: *service
    profiles: [kafka]
    cpuset: "${BENCH_CPUS_SERVICE:-2}"
    environment:
      <<: *service-env
      KAFKA_BROKERS: kafka:9092
      KAFKA_PARTITIONS: "6"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"

  consumer:
    <<: *service
    profiles: [kafka]
    cpuset: "${BENCH_CPUS_CONSUMER:-3}"
    environment:
      <<: *service-env
      ROLE: consumer
      KAFKA_BROKERS: kafka:9092
      KAFKA_PARTITIONS: "6"
      KAFKA_CONSUMERS: "3"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:8080"

  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    # run.py sets BENCH_CPUS_K6 per stack (the CPUs the stack leaves free, except the service's
    # hyperthread sibling, which stays idle) and records each container's cpuset and how they
    # fall on physical cores in results/<experiment>/environment.json.
    cpuset: "${BENCH_CPUS_K6:-6,7}"
    # The image runs as uid 12345: run.py makes results/.k6 writable for it (chmod 777) so that
    # handleSummary can write on Linux (untested on Linux so far).
    volumes:
      - ./k6:/scripts:ro
      - ./results/.k6:/out
