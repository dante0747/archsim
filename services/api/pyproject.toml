[project]
name = "archsim-api"
version = "0.3.0"
description = "ArchSim's Alembic migrations (up to revision 0008, where archsim-app's Flyway takes over), until stage 6 of the Java port."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  # the migrations' PostgreSQL driver, which scripts/schema_snapshot.py uses too, until stage 6
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
]

[project.scripts]
archsim-api = "archsim_api.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archsim_api"]
