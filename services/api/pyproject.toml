[project]
name = "archsim-api"
version = "0.3.0"
description = "ArchSim simulation workers: they simulate the runs the API (archsim-app) queues."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "archsim-engine",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
]

[project.scripts]
archsim-api = "archsim_api.__main__:main"

[tool.uv.sources]
archsim-engine = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archsim_api"]
