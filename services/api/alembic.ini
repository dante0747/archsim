# Alembic CLI configuration (the API also runs migrations programmatically on startup when
# ARCHSIM_AUTO_MIGRATE=true). The database URL comes from ARCHSIM_DATABASE_URL; see
# src/archsim_api/migrations/env.py.
[alembic]
script_location = src/archsim_api/migrations
sqlalchemy.url = sqlite:///./archsim.db
