# Alembic CLI configuration, for the schema up to revision 0008, where archsim-app's Flyway takes
# over (`archsim-api migrate` runs the same migrations). The database URL comes from
# ARCHSIM_DATABASE_URL; see src/archsim_api/migrations/env.py.
[alembic]
script_location = src/archsim_api/migrations
sqlalchemy.url = postgresql+psycopg://archsim:archsim@127.0.0.1:5432/archsim
