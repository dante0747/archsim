# Versions of everything the Java build uses, in one place. Bump here, nowhere else.

[versions]
java = "25"
junit = "6.1.3"
assertj = "3.27.7"
jackson = "3.2.4"
# the versions Spring Boot manages, so the engine and the CLI are built and tested against what
# the app runs; the app's checkBootManagedVersions fails the build when Boot moves them (ADR-0043,
# ADR-0057)
snakeyaml = "2.6"
httpclient5 = "5.6.5"
slf4j = "2.0.20"
spring-boot = "4.1.2"
springdoc = "3.2.0"
embedded-postgres = "2.2.2"
postgres-binaries = "16.15.0"
postgresql = "42.7.14"
jspecify = "1.0.1"
errorprone = "2.52.0"
nullaway = "0.14.3"
jacoco = "0.8.16"
archunit = "1.5.1"
jqwik = "1.10.2"
spring-javaformat = "0.0.48"
checkstyle = "14.3.0"
errorprone-plugin = "5.2.0"
jib = "3.4.5"
picocli = "4.7.7"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
# the Prometheus client of calibrations: a connection pinned to the address checked (ADR-0046),
# in the engine for the app and the CLI (ADR-0057)
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }
# HttpClient logs through SLF4J: the CLI binds it to nothing, so its standard error holds only
# its own lines (ADR-0057)
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
# the command line, `archsim` (ADR-0051)
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
spring-javaformat-checkstyle = { module = "io.spring.javaformat:spring-javaformat-checkstyle", version.ref = "spring-javaformat" }

# Spring Boot's BOM manages the versions of the libraries below it (archsim-app)
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-jdbc-test = { module = "org.springframework.boot:spring-boot-starter-jdbc-test" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
# PostgreSQL for tests, from Maven Central rather than Docker (ADR-0033)
embedded-postgres = { module = "io.zonky.test:embedded-postgres", version.ref = "embedded-postgres" }
embedded-postgres-binaries-bom = { module = "io.zonky.test.postgres:embedded-postgres-binaries-bom", version.ref = "postgres-binaries" }

# Gradle plugins, as dependencies of the convention plugins in build-logic/
spring-javaformat-gradle-plugin = { module = "io.spring.javaformat:spring-javaformat-gradle-plugin", version.ref = "spring-javaformat" }
errorprone-gradle-plugin = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorprone-plugin" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
# builds archsim-app's image without a Dockerfile (ADR-0014)
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
