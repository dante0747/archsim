# Versions of everything the Java build uses, in one place. Bump here, nowhere else.

[versions]
java = "25"
junit = "6.1.3"
assertj = "3.27.7"
jackson = "3.2.4"
postgresql = "42.7.14"
jspecify = "1.0.1"
errorprone = "2.52.0"
nullaway = "0.14.3"
jacoco = "0.8.16"
archunit = "1.5.1"
jqwik = "1.10.2"
spring-javaformat = "0.0.48"
checkstyle = "14.3.0"
errorprone-plugin = "5.2.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
spring-javaformat-checkstyle = { module = "io.spring.javaformat:spring-javaformat-checkstyle", version.ref = "spring-javaformat" }

# Gradle plugins, as dependencies of the convention plugins in build-logic/
spring-javaformat-gradle-plugin = { module = "io.spring.javaformat:spring-javaformat-gradle-plugin", version.ref = "spring-javaformat" }
errorprone-gradle-plugin = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorprone-plugin" }
