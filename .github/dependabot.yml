version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      web:
        patterns: ["*"]
    # Held back until the lint tooling supports them: typescript-eslint does not support
    # TypeScript 7 yet, and the plugins in eslint-config-next accept ESLint up to 9. Remove a
    # rule once `npm run lint` passes with that version.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "eslint"
        versions: [">=10"]
  # The Java build: gradle/libs.versions.toml, the plugins in settings and build-logic, and the
  # wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      java:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  # The benchmark services: no version updates (a change would alter the harness the committed
  # results were measured with), but security updates still open, with these commit messages.
  - package-ecosystem: npm
    directory: /benchmarks/service
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: gomod
    directory: /benchmarks/service-go
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: maven
    directory: /benchmarks/service-java
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: pip
    directory: /benchmarks/service-python
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
