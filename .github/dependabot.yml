version: 2
# Version updates are monthly and grouped by ecosystem, to keep the update pull requests few: each
# one, and each rebase of one when main moves, runs CI again. Security updates still open as soon
# as an advisory is published; the schedule does not apply to them.
#
# A group takes only minor and patch releases, which land once CI is green. A major release opens a
# pull request of its own, which waits for the owner, so it never holds back the rest of its group.
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      web:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Held back until the lint tooling supports them: typescript-eslint does not support
    # TypeScript 7 yet, and the plugins in eslint-config-next accept ESLint up to 9. Remove a
    # rule once `npm run lint` passes with that version.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "eslint"
        versions: [">=10"]
  # The Java build: gradle/libs.versions.toml, the plugins in settings and build-logic, and the
  # wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      java:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # The libraries the catalog pins at the versions Spring Boot manages (ADR-0043, ADR-0057): they
    # move with a Spring Boot upgrade, which fails checkBootManagedVersions until the catalog
    # follows, and never alone, so an update of one by itself could not pass the build. This also
    # stops their security updates; Dependabot's alerts still list them.
    ignore:
      - dependency-name: "org.yaml:snakeyaml"
      - dependency-name: "org.apache.httpcomponents.client5:httpclient5"
      - dependency-name: "org.slf4j:slf4j-nop"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
  # The benchmark services: no version updates (a change would alter the harness the committed
  # results were measured with), but security updates still open, with these commit messages.
  - package-ecosystem: npm
    directory: /benchmarks/service
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: gomod
    directory: /benchmarks/service-go
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: maven
    directory: /benchmarks/service-java
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: pip
    directory: /benchmarks/service-python
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
