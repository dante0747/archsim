name: ArchSim check
description: >-
  Simulate an ArchSim design, check its objectives, compare it with the base branch and post
  one sticky pull request comment per design (updated on every push). Fails the job when an
  objective is missed or a metric regresses past its threshold, as fail-on asks, and when the
  check cannot run (exit 2). Runs ArchSim's Java CLI in an image the job builds from the ArchSim
  checkout (ADR-0060): a Linux runner with Docker.
inputs:
  design:
    description: Path of the design (ArchSim JSON) in the repository.
    required: true
  scenario:
    description: A scenario of the design to check instead of the design as drawn.
    required: false
    default: ""
  baseline-ref:
    description: >-
      Git ref to compare with (for example origin/main). Empty for no comparison. The ref must
      be fetched (actions/checkout with fetch-depth 0): one that cannot be read fails the job.
    required: false
    default: ""
  fail-on:
    description: "objectives, regression, or both (comma separated)."
    required: false
    default: objectives
  knee:
    description: Also find the breaking point of both (several extra simulations).
    required: false
    default: "false"
  max-p95-increase:
    description: Relative p95 increase that counts as a regression.
    required: false
    default: "0.10"
  max-cost-increase:
    description: Relative monthly cost increase that counts as a regression.
    required: false
    default: "0.10"
  comment:
    description: Post or update the sticky comment on pull requests.
    required: false
    default: "true"
  comment-author:
    description: >-
      The login the token posts as; only its own comment is updated (github-actions[bot] for
      the workflow's GITHUB_TOKEN).
    required: false
    default: github-actions[bot]
  archsim-directory:
    description: >-
      An ArchSim checkout to build and run, relative to the workspace. Empty (the default): the
      repository this action comes from.
    required: false
    default: ""
outputs:
  passed:
    description: "true or false"
    value: ${{ steps.check.outputs.passed }}
  exit-code:
    description: "0 passes, 1 fails, 2 the check could not run"
    value: ${{ steps.check.outputs.exit-code }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        DESIGN: ${{ inputs.design }}
        SCENARIO: ${{ inputs.scenario }}
        BASELINE_REF: ${{ inputs.baseline-ref }}
        FAIL_ON: ${{ inputs.fail-on }}
        KNEE: ${{ inputs.knee }}
        MAX_P95: ${{ inputs.max-p95-increase }}
        MAX_COST: ${{ inputs.max-cost-increase }}
        ARCHSIM_DIR: ${{ inputs.archsim-directory }}
        REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -u
        # one comment, artifact and set of files per design (and scenario): a job or a matrix
        # that checks several designs does not overwrite one result with another
        key="$DESIGN${SCENARIO:+#$SCENARIO}"
        slug=$(printf '%s' "$key" | tr -c 'A-Za-z0-9._-' '_')
        # the action's own folder, the one the container may write in
        files="$RUNNER_TEMP/archsim-check-$slug"
        mkdir -p "$files"
        md="$files/archsim-check-$slug.md"
        js="$files/archsim-check-$slug.json"
        {
          echo "key=$key"
          echo "slug=$slug"
          echo "markdown=$md"
          echo "json=$js"
        } >> "$GITHUB_OUTPUT"
        args=("$GITHUB_WORKSPACE/$DESIGN" --format markdown --out "$md" --json-out "$js"
              --report-url "$REPORT_URL" --max-p95-increase "$MAX_P95" --max-cost-increase "$MAX_COST")
        [ -n "$SCENARIO" ] && args+=(--scenario "$SCENARIO")
        [ -n "$BASELINE_REF" ] && args+=(--baseline-ref "$BASELINE_REF")
        [ "$KNEE" = "true" ] && args+=(--knee)
        IFS=',' read -ra modes <<< "$FAIL_ON"
        for m in "${modes[@]}"; do args+=(--fail-on "$(echo "$m" | xargs)"); done
        # the action's own repository (three levels up) unless another checkout is named
        archsim="${ARCHSIM_DIR:+$GITHUB_WORKSPACE/$ARCHSIM_DIR}"
        archsim="${archsim:-$GITHUB_ACTION_PATH/../../..}"
        # why a check that could not run did not: the CLI's own refusal unless said otherwise
        reason="The design or its baseline could not be used; the job log says why."
        set +e
        if [ "$RUNNER_OS" != "Linux" ]; then
          echo "::error::The ArchSim check runs in a Linux container: use a Linux runner with Docker."
          reason="The check runs in a Linux container: this runner is not Linux."
          code=2
        else
          # a tag of this check's own: another job on the same Docker may build the same image,
          # and removing a tag removes the image only when no other tag names it
          image="archsim-check:$(cat /proc/sys/kernel/random/uuid)"
          echo "::group::Build the ArchSim image"
          docker build --file "$archsim/.github/actions/archsim-check/Dockerfile" --tag "$image" "$archsim"
          built=$?
          echo "::endgroup::"
          if [ "$built" -ne 0 ]; then
            echo "::error::ArchSim's image did not build (exit $built): the log of its build says why."
            reason="ArchSim's image did not build; the job log says why."
            code=2
          else
            # the runner's user, who owns the checkout, so git trusts it and the files written are
            # the job's; the workspace to read and the action's folder to write, no network
            docker run --rm --network none --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" --volume "$files:$files" \
              --workdir "$GITHUB_WORKSPACE" "$image" check "${args[@]}"
            code=$?
            docker image rm "$image" > /dev/null
            if [ "$code" -gt 2 ]; then
              # Docker's own (125 to 127) or a kill's, not the CLI's
              echo "::error::The check's container ended with exit code $code."
              reason="The check's container did not run to its end; the job log says why."
              code=2
            fi
          fi
        fi
        set -e
        if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
          # replace an earlier verdict rather than leave it standing on the pull request
          printf '%s\n' '<!-- archsim-check -->' \
            "### ⚠️ ArchSim check could not run (exit $code)" '' "$reason" > "$md"
        fi
        cat "$md" >> "$GITHUB_STEP_SUMMARY" || true
        echo "passed=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: archsim-check-${{ steps.check.outputs.slug }}
        path: |
          ${{ steps.check.outputs.markdown }}
          ${{ steps.check.outputs.json }}
        if-no-files-found: ignore
    - if: github.event_name == 'pull_request' && inputs.comment == 'true'
      continue-on-error: true  # pull requests from forks get a read-only token
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        KEY: ${{ steps.check.outputs.key }}
        BODY: ${{ steps.check.outputs.markdown }}
        AUTHOR: ${{ inputs.comment-author }}
      run: >-
        python "$GITHUB_ACTION_PATH/sticky_comment.py" --repo "$GITHUB_REPOSITORY" --pr "$PR"
        --body-file "$BODY" --key "$KEY" --author "$AUTHOR"
    - shell: bash
      env:
        CODE: ${{ steps.check.outputs.exit-code }}
      run: |
        if [ "${CODE:-2}" != "0" ]; then
          echo "ArchSim check failed (exit ${CODE:-2})"; exit "${CODE:-2}"
        fi
