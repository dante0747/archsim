name: Price refresh

# Once a month, rebuild the AWS us-east-1 price snapshot from the public AWS Price List bulk API
# (no account or key needed) and open a pull request with it and a summary of what changed. A
# person reviews and merges it; nothing here changes main by itself, and when no price changed no
# pull request is opened.
#
# After the merge, new projects pin the new snapshot. Templates stay pinned to the one they name
# until someone re-pins them (see docs/pricing.md, "Refreshing snapshots"), because a new snapshot
# can change sizes and so simulation results. Older snapshots stay, so saved designs pinned to
# them reproduce.
#
# Pull requests opened with the default GITHUB_TOKEN do not start other workflows (CI): set a
# PRICES_PR_TOKEN secret (a fine-grained token with contents and pull-requests write) to have CI
# run on them, or close and reopen the pull request.
#
# The snapshots are archsim-model's resources (ADR-0026), every file of their folder shipped. The
# monthly schedule ("23 6 2 * *", 06:23 UTC on the 2nd) is off, and it is run by hand only: the
# golden pricing entries and some sizing tests still expect 0.16.0's two snapshots to be the only
# ones, so a new snapshot fails them until they stop assuming it; and Actions minutes are short.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prices
  cancel-in-progress: false

env:
  REGION: us-east-1

jobs:
  build:
    # builds and checks the snapshot with the repository read-only: the downloads and the Gradle
    # build never hold a token that can write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      date: ${{ steps.build.outputs.date }}
      file: ${{ steps.build.outputs.file }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      # also checks the committed Gradle wrapper against Gradle's published checksums
      - uses: gradle/actions/setup-gradle@v6
      # archsim-tools' price refresh, installed so that each step runs it in its own environment
      # (GITHUB_OUTPUT is a file of the step's own)
      - name: Install the price refresh
        run: ./gradlew :archsim-tools:installDist
      - name: Build the snapshot
        id: build
        run: |
          date="$(date -u +%F)"
          out="archsim-model/src/main/resources/io/archsim/model/pricing/snapshots/aws-${REGION}-${date}.json"
          if [ -e "$out" ]; then echo "$out exists already"; exit 1; fi
          archsim-tools/build/install/archsim-tools/bin/archsim-tools prices aws --region "$REGION" --cache "$RUNNER_TEMP/aws-prices"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "file=$out" >> "$GITHUB_OUTPUT"
      - name: Check it with the model's tests, which read every snapshot
        run: ./gradlew :archsim-model:test
      - name: Check the price refresh
        run: ./gradlew :archsim-tools:test
      - name: Summarize the price changes
        id: diff
        run: |
          mkdir -p "$RUNNER_TEMP/snapshot"
          archsim-tools/build/install/archsim-tools/bin/archsim-tools prices diff "${{ steps.build.outputs.file }}" | tee "$RUNNER_TEMP/snapshot/summary.md"
          cp "${{ steps.build.outputs.file }}" "$RUNNER_TEMP/snapshot/"
      - uses: actions/upload-artifact@v7
        if: steps.diff.outputs.changed == 'true'
        with:
          name: price-snapshot
          path: ${{ runner.temp }}/snapshot/
          retention-days: 7
      - name: No change
        if: steps.diff.outputs.changed != 'true'
        run: echo "Prices are the same as the last snapshot; no pull request."

  pull-request:
    # the one job that writes: a branch with the checked snapshot, and its pull request
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: price-snapshot
          path: ${{ runner.temp }}/snapshot
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.PRICES_PR_TOKEN || github.token }}
          DATE: ${{ needs.build.outputs.date }}
          FILE: ${{ needs.build.outputs.file }}
        run: |
          branch="prices/aws-${REGION}-${DATE}"
          cp "$RUNNER_TEMP/snapshot/$(basename "$FILE")" "$FILE"
          {
            cat "$RUNNER_TEMP/snapshot/summary.md"
            echo
            echo "---"
            echo "Opened by the monthly price refresh (.github/workflows/prices.yml). Before merging:"
            echo
            echo "- [ ] Spot-check a few prices against https://aws.amazon.com/ec2/pricing/on-demand/ and the RDS, ElastiCache and MSK pricing pages."
            echo "- [ ] CI passes. New projects will pin this snapshot after the merge; templates keep theirs until re-pinned."
          } > "$RUNNER_TEMP/body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$FILE"
          git commit -m "chore(pricing): add the AWS ${REGION} price snapshot of ${DATE}"
          git push --force origin "$branch"
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
              --title "chore(pricing): add the AWS ${REGION} price snapshot of ${DATE}" --body-file "$RUNNER_TEMP/body.md"
          fi
