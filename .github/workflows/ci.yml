name: CI

# The repository is private, so every minute here is billed (2,000 included a month). The
# `changes` job (scripts/ci_changes.py) works out which jobs a change can affect and the others
# are skipped: a docs change runs none, a web change runs Web and End-to-end. A run started by
# hand (Actions > CI > Run workflow) runs every job.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's new commits cancel its older run: the next run checks the whole pull request.
# Pushes and runs by hand never cancel one another: a push's run tests only what that push
# changed, so a cancelled run would leave its changes untested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"

jobs:
  commits:
    # every commit a pull request or push adds: Conventional Commits, no AI co-author trailer
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # a push that creates the branch or rewrites history has no usable base: check it all
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            RANGE="$BASE_SHA..$HEAD_SHA"
          else
            RANGE="$HEAD_SHA"
          fi
          python3 scripts/check_commits.py --range "$RANGE"

  changes:
    # which of the jobs below this change needs; the log says which file needs each one
    name: Changed parts
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.jobs.outputs.python }}
      benchmark_tests: ${{ steps.jobs.outputs.benchmark_tests }}
      migrations: ${{ steps.jobs.outputs.migrations }}
      java: ${{ steps.jobs.outputs.java }}
      archsim_check: ${{ steps.jobs.outputs.archsim_check }}
      web: ${{ steps.jobs.outputs.web }}
      e2e: ${{ steps.jobs.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: jobs
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            python3 scripts/ci_changes.py --all --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_changes.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          fi

  python:
    name: Python (migrations, harness, scripts; SQLite)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check services benchmarks scripts
      - name: Format
        run: uv run ruff format --check services benchmarks scripts
      - name: Type check
        run: uv run mypy services/api/src
      - name: Tests
        # every testpath but the benchmarks' (--ignore does not apply to a testpath itself)
        run: uv run pytest --deselect benchmarks/tests
      # The benchmarks' tests, about 9 minutes: they calibrate and simulate with the Java engine
      # (ADR-0062), and ask it for its functions (ADR-0061), through the CLI installed here. Only a
      # change to the engine or to a file they read can change their result (scripts/ci_changes.py).
      - uses: actions/setup-java@v6
        if: needs.changes.outputs.benchmark_tests == 'true'
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        if: needs.changes.outputs.benchmark_tests == 'true'
      - name: Install the Java CLI
        if: needs.changes.outputs.benchmark_tests == 'true'
        run: ./gradlew :archsim-cli:installDist
      - name: Benchmark tests
        if: needs.changes.outputs.benchmark_tests == 'true'
        run: uv run pytest benchmarks/tests
      - name: Type check the benchmark scripts
        run: uv run mypy benchmarks
      # stage 4's parity page is written from the committed runs (docs/validation's parity JSON,
      # the knees in benchmarks/results/dev/0.16.0-port and 0.16.0-java, the speed in
      # benchmarks/perf): it must still say what they say
      - name: The Java parity page matches its runs
        run: uv run python scripts/java_parity_report.py --check

  api-postgres:
    # services/api's Alembic migrations on PostgreSQL, until stage 6: they build the models'
    # schema, and processes that migrate at once take turns
    name: Migrations on PostgreSQL
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archsim
          POSTGRES_PASSWORD: archsim
          POSTGRES_DB: archsim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archsim -d archsim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARCHSIM_TEST_DATABASE_URL: postgresql+psycopg://archsim:archsim@127.0.0.1:5432/archsim_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest services/api/tests

  java:
    # the Java build (Spring's formatting, Checkstyle, Error Prone and NullAway, unit tests,
    # coverage; any finding fails it, see docs/java-conventions.md), the API's image, then the
    # black-box API tests against the Java API they start on PostgreSQL; see
    # archsim-api-tests/README.md and docs/proposals/java-25-port.md
    name: Java (Gradle build, black-box API tests)
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archsim
          POSTGRES_PASSWORD: archsim
          POSTGRES_DB: archsim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archsim -d archsim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      # also checks the committed Gradle wrapper against Gradle's published checksums
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build
      - name: Build the API's image (a tarball, no Docker needed)
        run: ./gradlew :archsim-app:jibBuildTar
      # the whole suite, against the Java API with a Java worker next to it (ADR-0053)
      - name: Black-box API tests
        run: ./gradlew :archsim-api-tests:apiTest -Parchsim.api.start=java
      - name: Upload the test reports and server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: java-test-reports
          path: |
            archsim-api-tests/build/reports/
            archsim-api-tests/build/api-servers/*.log
            */build/reports/checkstyle/
          retention-days: 14

  archsim-check:
    # the repository's own SLO gate action, which builds this checkout's CLI into its image
    # (ADR-0060), on a template, against the base branch (pull requests) or the previous commit
    # (pushes); see docs/ci.md
    name: ArchSim check (action on a template)
    needs: changes
    if: needs.changes.outputs.archsim_check == 'true'
    runs-on: ubuntu-latest
    # the image's build downloads Gradle and the dependencies: minutes, which a hung download
    # would otherwise spend up to GitHub's six hours
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # the comment the action posts (ADR-0064), with Node's own test runner
      - name: The action's comment
        run: node --test .github/actions/archsim-check/sticky-comment.test.js
      - uses: ./.github/actions/archsim-check
        with:
          design: examples/cache-aside-starter.json
          baseline-ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          fail-on: objectives,regression

  web:
    name: Web (lint, types, tests, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # build first: it generates next-env.d.ts and route types that tsc needs
      - run: npm run build
      - run: npm run typecheck

  e2e:
    # the main path in Chromium against a production build and the real API: the Java API with a
    # Java worker, on PostgreSQL; see apps/web/e2e/api-server.mjs, which makes the database with
    # the PostgreSQL driver in the API's jar
    name: End-to-end (Playwright, main path)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archsim
          POSTGRES_PASSWORD: archsim
          POSTGRES_DB: archsim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archsim -d archsim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_POSTGRES_URL: postgresql://archsim:archsim@127.0.0.1:5432/archsim
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :archsim-app:bootJar
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Upload the Playwright trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: apps/web/test-results/
          retention-days: 14
