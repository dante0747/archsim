name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"

jobs:
  commits:
    # every commit a pull request or push adds: Conventional Commits, no AI co-author trailer
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # a push that creates the branch or rewrites history has no usable base: check it all
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            RANGE="$BASE_SHA..$HEAD_SHA"
          else
            RANGE="$HEAD_SHA"
          fi
          python3 scripts/check_commits.py --range "$RANGE"

  python:
    name: Python (engine + API, SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check packages services benchmarks
      - name: Format
        run: uv run ruff format --check packages services benchmarks
      - name: Type check
        run: uv run mypy packages/engine/src services/api/src packages/mcp/src services/engine-service/src
      - name: Tests
        run: uv run pytest
      - name: Type check the benchmark scripts
        run: uv run mypy benchmarks
      # the engine is frozen at 0.16.0 for the Java port: its outputs must still be the golden
      # files the Java tests compare with (parity/README.md)
      - name: Golden files match the engine
        run: uv run python scripts/export_golden.py --check

  api-postgres:
    name: API tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archsim
          POSTGRES_PASSWORD: archsim
          POSTGRES_DB: archsim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archsim -d archsim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARCHSIM_TEST_DATABASE_URL: postgresql+psycopg://archsim:archsim@127.0.0.1:5432/archsim_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest services/api/tests

  api-windows:
    # simulation processes on Windows: the Job Object that kills them with their worker,
    # Ctrl+Break handling, and the venv launcher between a worker and its interpreter
    name: API tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest services/api/tests

  java:
    # the Java build (Spring's formatting, Checkstyle, Error Prone and NullAway, unit tests,
    # coverage; any finding fails it, see docs/java-conventions.md), then the black-box API tests
    # against the Python API they start on PostgreSQL; see archsim-api-tests/README.md and
    # docs/proposals/java-25-port.md
    name: Java (Gradle build, black-box API tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archsim
          POSTGRES_PASSWORD: archsim
          POSTGRES_DB: archsim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archsim -d archsim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      # also checks the committed Gradle wrapper against Gradle's published checksums
      - uses: gradle/actions/setup-gradle@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Build
        run: ./gradlew build
      - name: Build the API's image (a tarball, no Docker needed)
        run: ./gradlew :archsim-app:jibBuildTar
      - name: Black-box API tests against the Python API
        run: ./gradlew :archsim-api-tests:apiTest -Parchsim.api.start=python
      # the whole suite, against the Java API with the Python engine service and a Python worker
      # next to it
      - name: Black-box API tests against the Java API
        run: ./gradlew :archsim-api-tests:apiTest -Parchsim.api.start=java
      - name: Upload the test reports and server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: java-test-reports
          path: |
            archsim-api-tests/build/reports/
            archsim-api-tests/build/api-servers/*.log
            */build/reports/checkstyle/
          retention-days: 14

  archsim-check:
    # the repository's own SLO gate action, on a template, against the base branch (pull
    # requests) or the previous commit (pushes); see docs/ci.md
    name: ArchSim check (action on a template)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/archsim-check
        with:
          design: examples/cache-aside-starter.json
          baseline-ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          fail-on: objectives,regression

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # build first: it generates next-env.d.ts and route types that tsc needs
      - run: npm run build
      - run: npm run typecheck

  e2e:
    # the main path in Chromium against a production build and the real API: the Java API with
    # the Python engine service and a Python worker, on PostgreSQL; see apps/web/e2e/api-server.mjs
    name: End-to-end (Playwright, main path)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archsim
          POSTGRES_PASSWORD: archsim
          POSTGRES_DB: archsim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archsim -d archsim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_POSTGRES_URL: postgresql://archsim:archsim@127.0.0.1:5432/archsim
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :archsim-app:bootJar
        working-directory: .
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Upload the Playwright trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: apps/web/test-results/
          retention-days: 14
