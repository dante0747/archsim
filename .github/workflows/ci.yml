name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"

jobs:
  python:
    name: Python (engine + API, SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check packages services benchmarks
      - name: Format
        run: uv run ruff format --check packages services benchmarks
      - name: Type check
        run: uv run mypy packages/engine/src services/api/src packages/mcp/src
      - name: Tests
        run: uv run pytest
      - name: Type check the benchmark scripts
        run: uv run mypy benchmarks

  api-postgres:
    name: API tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archsim
          POSTGRES_PASSWORD: archsim
          POSTGRES_DB: archsim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archsim -d archsim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARCHSIM_TEST_DATABASE_URL: postgresql+psycopg://archsim:archsim@127.0.0.1:5432/archsim_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest services/api/tests

  archsim-check:
    # the repository's own SLO gate action, on a template, against the base branch (pull
    # requests) or the previous commit (pushes); see docs/ci.md
    name: ArchSim check (action on a template)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/archsim-check
        with:
          design: examples/cache-aside-starter.json
          baseline-ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          fail-on: objectives,regression

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # build first: it generates next-env.d.ts and route types that tsc needs
      - run: npm run build
      - run: npm run typecheck
