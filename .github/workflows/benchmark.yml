name: Accuracy benchmarks

# Measures ArchSim's predictions against real stacks (benchmarks/, docs/validation.md). Slow
# (about 1.5 hours) and noisy on shared runners, so never on pull requests: it runs by hand only
# for now (the weekly and release-tag runs below are off, see NOT YET RUN ON LINUX). Each run keeps
# the previous results in run-N/ folders
# (the harness's --archive), measures again, regenerates docs/validation.md, its charts and
# docs/validation/accuracy.json with the web app's copy (report --json, which the /accuracy
# page is built from), uploads the raw results as an artifact and opens a pull request. A person
# reviews and merges it; nothing here changes main by itself.
#
# NOT YET RUN ON LINUX. Every run so far was on Windows with Docker Desktop; on a hosted runner the
# k6 container writes its summary as uid 12345 (the harness makes benchmarks/results/.k6
# world-writable for it, untested on Linux). The scheduled run on 2026-11-02 hit the 120-minute
# timeout and was cancelled, and the hand-started runs on 2026-10-28 failed. Get a run started by
# hand (Actions > Accuracy benchmarks > Run workflow) to pass, and check its artifact and pull
# request, before turning the schedule and the tag trigger back on.
#
# Pull requests opened with the default GITHUB_TOKEN do not start other workflows (CI): set a
# BENCHMARK_PR_TOKEN secret (a fine-grained token with contents and pull-requests write) to have
# CI run on them, or close and reopen the pull request. The repository must allow GitHub Actions
# to create pull requests (Settings > Actions > General > Workflow permissions).
on:
  # Manual runs (Actions > Accuracy benchmarks > Run workflow).
  workflow_dispatch:
    inputs:
      stack:
        description: "postgres, cache, kafka or all"
        default: all

  # ---------------------------------------------------------------------------------------------
  # AUTOMATIC RUNS. Each run takes a hosted runner about 1.5 hours. To turn them off, comment out
  # or delete the lines below:
  #   - the weekly run: the `schedule:` line and the `- cron:` line under it;
  #   - the run for every release tag: the `push:` line and the `tags:` line under it.
  # Manual runs above keep working either way.
  # Off until a run started by hand passes on Linux (see NOT YET RUN ON LINUX above); uncomment the
  # four lines below to turn them back on.
  # schedule:
  #   - cron: "17 3 * * 1" # 03:17 UTC every Monday
  # push:
  #   tags: ["v*"]
  # --------------------------------------------------------------- end of automatic runs ------

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      # also checks the committed Gradle wrapper against Gradle's published checksums
      - uses: gradle/actions/setup-gradle@v6
      - name: Benchmarks
        env:
          STACK: ${{ inputs.stack || 'all' }}
        # Hosted runners have 2 vCPUs in private repositories (4 in public ones), too few to give
        # each container its own: every container shares all of them (noisier than a dedicated
        # box, where compose.yaml's defaults pin each to its own CPUs).
        run: |
          cpus="0-$(( $(nproc) - 1 ))"
          for name in POSTGRES REDIS REDIS_TTL KAFKA SERVICE CONSUMER GATEWAY CHAIN_API JAVA GO PYTHON PYTHON_CORES PYTHON_WIDE GO_POOL K6; do export "BENCH_CPUS_$name=$cpus"; done
          echo "every container shares CPUs $cpus"
          ./gradlew :archsim-benchmarks:run --args="$STACK --archive"
      # the new runs' knees by three simple estimates (baselines.json), then the page
      - name: Report
        run: |
          ./gradlew :archsim-benchmarks:run --args="baselines"
          ./gradlew :archsim-benchmarks:run --args="report --json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            benchmarks/results/
            docs/validation.md
            docs/validation/
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_PR_TOKEN || github.token }}
          TRIGGER: ${{ github.event_name == 'push' && github.ref_name || github.event_name }}
          STACK: ${{ inputs.stack || 'all' }}
        run: |
          date="$(date -u +%F)"
          branch="benchmarks/${date}-${GITHUB_RUN_ID}"
          {
            echo "Accuracy benchmarks (${STACK}) run on ${date} by ${TRIGGER}, on a GitHub-hosted"
            echo "Linux runner ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID});"
            echo "raw results in its artifact). The previous results are kept in \`run-N/\` folders."
            echo
            # the page's generated summary and tiers, as they stand after the run
            for name in summary tiers; do
              awk -v begin="<!-- BEGIN GENERATED: $name -->" -v name="$name" '
                $0 == begin { inside = 1; found = 1; next }
                inside && index($0, "<!-- END GENERATED") == 1 { inside = 0 }
                inside { print }
                END { if (!found) print "(no " name " block)" }' docs/validation.md
              echo
            done
            echo "---"
            echo "Opened by .github/workflows/benchmark.yml. Before merging:"
            echo
            echo "- [ ] The numbers are plausible (no stack failed to start, no step without requests)."
            echo "- [ ] The hand-written text in docs/validation.md (headline bullets, protocol history, \"Where the model is wrong\") matches the new numbers."
            echo "- [ ] Tests that pin the committed numbers are updated (archsim-benchmarks: \`Committed*Tests\`, \`ReportParityTests\`)."
            echo "- [ ] CI passes; /accuracy is rebuilt from apps/web/src/data/accuracy.json on the next web build."
          } > "$RUNNER_TEMP/body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add benchmarks/results docs/validation.md docs/validation apps/web/src/data/accuracy.json
          git commit -m "chore(benchmarks): record the results of ${date} (${STACK}, ${TRIGGER})"
          git push origin "$branch"
          base="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef -q .defaultBranchRef.name)"
          gh pr create --base "$base" --head "$branch" \
            --title "chore(benchmarks): record the results of ${date} (${STACK}, ${TRIGGER})" --body-file "$RUNNER_TEMP/body.md"
