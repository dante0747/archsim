name: Accuracy benchmarks

# Slow (about 1.5 hours) and noisy on shared runners, so never on pull requests. Manual for now; to
# run it nightly, uncomment the schedule (it uses Actions minutes). Results are uploaded as an
# artifact; docs/validation.md is only updated by a person who reviews them.
on:
  workflow_dispatch:
    inputs:
      stack:
        description: "postgres, cache, kafka or all"
        default: all
  # schedule:
  #   - cron: "17 3 * * *"

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # hosted runners have 4 vCPUs: share them instead of pinning (noisier than a dedicated box)
      BENCH_CPUS_POSTGRES: "0-3"
      BENCH_CPUS_REDIS: "0-3"
      BENCH_CPUS_KAFKA: "0-3"
      BENCH_CPUS_SERVICE: "0-3"
      BENCH_CPUS_CONSUMER: "0-3"
      BENCH_CPUS_K6: "0-3"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Benchmarks
        env:
          STACK: ${{ inputs.stack || 'all' }}
        run: uv run python benchmarks/run.py "$STACK"
      - name: Report
        run: uv run python benchmarks/report.py
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/results/
            docs/validation.md
            docs/validation/
